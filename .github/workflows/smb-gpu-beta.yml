name: Bambu include-cache and nullable-result validation (unqualified)
on:
  push:
    branches: [ci/smb-gpu-cache-result-beta-2.9.1-20261106]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SLIC3R_GPU_BACKEND: cpu
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ssrobins/install-cmake@v1
        with:
          version: 3.31.6
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libboost-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz' -OutFile boost-source.tar.gz
          if ((Get-FileHash boost-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a5800f405508f5df8114558ca9855d2640a2de8f0445f051fa1c7c3383045724') { throw 'Boost archive digest mismatch' }
          tar -xzf boost-source.tar.gz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "BOOST_ROOT=$pwd/boost_1_84_0" | Add-Content $env:GITHUB_ENV
      - run: cmake -S tests/gpu_safety -B build-contracts
      - run: cmake --build build-contracts --config Release --parallel 2
      - run: ctest --test-dir build-contracts -C Release --output-on-failure
      - name: Run standalone CUDA buffer contracts with registered XML counts
        shell: pwsh
        run: |
          $test = if ($env:RUNNER_OS -eq 'Windows') { 'build-contracts/Release/gpu_safety_tests.exe' } else { 'build-contracts/gpu_safety_tests' }
          & $test '[CudaDispatchBuffers]' --order rand --rng-seed 9473 -r xml -o standalone-cuda-buffer.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/gpu-validation/check_focused_catch.py --xml standalone-cuda-buffer.xml --repo . --kind cuda-buffer > standalone-cuda-buffer-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: standalone-CUDA-buffer-contracts-${{ runner.os }}
          path: |
            standalone-cuda-buffer.xml
            standalone-cuda-buffer-summary.json
            build-contracts/Testing/Temporary/LastTest.log
  windows-app:
    needs: contracts
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ssrobins/install-cmake@v1
        with:
          version: 3.31.6
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - name: Download completed source-matched VS2022 dependencies
        uses: actions/download-artifact@v6
        with:
          artifact-ids: '13416227177'
          repository: mk0000001/BambuStudio
          run-id: '42024835828'
          github-token: ${{ github.token }}
          path: upstream-deps
      - name: Verify exact dependency source compiler and digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedTree = 'dfcee1c78f98fa9ada89f461a2f4653ec9ad4cca'
          if ((git rev-parse HEAD:deps).Trim() -ne $expectedTree) { throw 'Dependency source tree changed' }
          $archive = @(Get-ChildItem upstream-deps -Recurse -File -Filter 'Bambu-2.9.1-Windows2022-v143-deps.zip')
          $provenanceFile = @(Get-ChildItem upstream-deps -Recurse -File -Filter 'Bambu-dependency-source.txt')
          $compilerFile = @(Get-ChildItem upstream-deps -Recurse -File -Filter 'CMakeCXXCompiler.cmake')
          if ($archive.Count -ne 1 -or $provenanceFile.Count -ne 1 -or $compilerFile.Count -ne 1) { throw 'Dependency artifact is incomplete' }
          $digest = (Get-FileHash -LiteralPath $archive[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '842fc0392a7c3ea889ec87068df510d9ff0c668509f929bf5a70c259a47829e1') { throw 'Dependency archive SHA256 mismatch' }
          $provenance = @{}
          foreach ($line in ((Get-Content -LiteralPath $provenanceFile[0].FullName -Raw) -split '[\r\n]+')) {
            if (-not $line.Trim()) { continue }
            $pair = $line.Trim() -split '=', 2
            if ($pair.Count -ne 2 -or $provenance.ContainsKey($pair[0])) { throw 'Malformed dependency provenance' }
            $provenance[$pair[0]] = $pair[1]
          }
          $expected = @{source='f5e38426e9cede6be98d642b2bc6e7b13a12700e';source_floor='c43bc49004a6ce527887056bfb4b31c0b6494dc8';deps_tree=$expectedTree;generator='Visual Studio 17 2022';platform='x64';toolset='v143';configuration='Release';DEP_DEBUG='OFF';run_id='42024835828';archive_sha256=$digest}
          foreach ($key in $expected.Keys) { if ($provenance[$key] -ne $expected[$key]) { throw "Unexpected dependency provenance: $key" } }
          $compilerMetadata = Get-Content -LiteralPath $compilerFile[0].FullName -Raw
          if ($compilerMetadata -notmatch 'CMAKE_CXX_COMPILER_VERSION "19\.[34]' -or $compilerMetadata -notmatch 'MSVC') { throw 'Dependency compiler is not supported VS2022 v143' }
          "$digest  $($archive[0].Name)" | Set-Content dependency-archive-sha256.txt -Encoding ascii
          Copy-Item -LiteralPath $provenanceFile[0].FullName -Destination dependency-source-used.txt
          Copy-Item -LiteralPath $compilerFile[0].FullName -Destination dependency-compiler-used.cmake
          New-Item -ItemType Directory deps/build/BambuStudio_dep -Force | Out-Null
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath deps/build/BambuStudio_dep
          foreach ($part in @('include','lib','bin')) {
            if (-not (Test-Path "deps/build/BambuStudio_dep/usr/local/$part" -PathType Container)) { throw "Dependency prefix missing: $part" }
          }
      - name: Install build utilities
        run: choco install nsis pkgconfiglite --yes --no-progress
      - name: Install Pascal-capable CUDA
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: true
          use-local-cache: true
      - name: Install Vulkan compiler
        run: choco install vulkan-sdk --version=1.4.363 --yes --no-progress
      - name: Verify official Vulkan runtime
        shell: pwsh
        run: |
          $vk = (Get-ChildItem C:/VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$vk" | Add-Content $env:GITHUB_ENV
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkan-runtime-components.zip' -OutFile vulkan-runtime-components.zip
          if ((Get-FileHash vulkan-runtime-components.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a25a927aa8b9f0371048f1861cf88ac3b9bc9b1fb332c42d897c8ab32695769a') { throw 'Vulkan runtime digest mismatch' }
          Expand-Archive vulkan-runtime-components.zip vulkan-runtime
          "VULKAN_RUNTIME_DIR=$pwd/vulkan-runtime/VulkanRT-X64-1.4.363.0-Components" | Add-Content $env:GITHUB_ENV
      - name: Configure actual CUDA and Vulkan app
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Include' -Directory | Where-Object Name -Match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1).FullName
          New-Item -ItemType Directory build-gpu/.cmake/api/v1/query -Force | Out-Null
          New-Item -ItemType File build-gpu/.cmake/api/v1/query/codemodel-v2 -Force | Out-Null
          cmake -S . -B build-gpu -G 'Visual Studio 17 2022' -A x64 -T "v143,cuda=$env:CUDA_PATH" -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 -DSLIC3R_BUILD_TESTS=ON -DSLIC3R_ENABLE_CUDA_SLICER=ON -DSLIC3R_ENABLE_VULKAN_SLICER=ON -DSLIC3R_GPU_SELFTEST=ON -DCMAKE_CUDA_ARCHITECTURES=61 "-DSLIC3R_VULKAN_RUNTIME_DLL=$env:VULKAN_RUNTIME_DIR/x64/vulkan-1.dll" "-DCMAKE_PREFIX_PATH=$pwd/deps/build/BambuStudio_dep/usr/local" "-DCMAKE_INSTALL_PREFIX=$pwd/install-beta" -DCMAKE_BUILD_TYPE=Release "-DWIN10SDK_PATH=$sdk" "-DCMAKE_PROJECT_INCLUDE=$pwd/.github/fff-diagnostics/TargetedFffSymbols.cmake"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify maintained target manifest before compilation
        shell: pwsh
        run: |
          $reply = 'build-gpu/.cmake/api/v1/reply'
          $index = @(Get-ChildItem $reply -Filter 'index-*.json')
          if ($index.Count -ne 1) { throw 'Expected one fresh CMake file-API index' }
          $modelName = (Get-Content $index[0].FullName -Raw | ConvertFrom-Json).reply.'codemodel-v2'.jsonFile
          $model = Get-Content (Join-Path $reply $modelName) -Raw | ConvertFrom-Json
          $release = @($model.configurations | Where-Object name -EQ 'Release')
          if ($release.Count -ne 1) { throw 'Missing Release target configuration' }
          $required = @('gpu_geometry_tests','gpu_rectilinear_candidates_tests','gpu_tree_candidates_tests')
          foreach ($name in $required) {
            $target = @($release[0].targets | Where-Object name -EQ $name)
            if ($target.Count -ne 1 -or -not (Test-Path "build-gpu/tests/gpu_geometry/$name.vcxproj")) { throw "Maintained IDE target missing: $name" }
          }
          $checkLinks = @('libslic3r_utils_tests','filament_group_tests','nozzle_inventory_tests','periodic_modifier_tests','support_material_on_wipe_tower_tests','gpu_geometry_tests','bambu_enum_map_tests')
          foreach ($name in $checkLinks) {
            $entry = @($release[0].targets | Where-Object name -EQ $name)
            if ($entry.Count -ne 1) { throw "Missing maintained link target: $name" }
            $target = Get-Content (Join-Path $reply $entry[0].jsonFile) -Raw | ConvertFrom-Json
            $fragments = @($target.link.commandFragments | ForEach-Object fragment) -join ' '
            if ($fragments -match '/FORCE:UNRESOLVED' -or $fragments -notmatch 'bcrypt' -or $fragments -notmatch 'libslic3r_gui') { throw "Invalid real dependency link boundary: $name" }
          }
          $selection = '^(libnest2d_tests|libslic3r_tests|fff_print_tests|sla_print_tests|cpp17_tests)$'
          $listing = ctest --test-dir build-gpu -C Release --exclude-regex $selection --show-only=json-v1 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $expected = @('slic3rutils_tests','support_material_on_wipe_tower_tests','periodic_modifier_tests','fila_manager_tests','filament_group_tests','nozzle_inventory_tests','libslic3r_utils_tests','gpu_rectilinear_candidates_tests','gpu_tree_candidates_tests','gpu_geometry_tests') | Sort-Object
          $actual = @($listing.tests | ForEach-Object name | Sort-Object)
          if (($actual -join ',') -ne ($expected -join ',')) { throw 'Maintained default test manifest changed' }
          $listing | ConvertTo-Json -Depth 30 | Set-Content maintained-test-manifest.json -Encoding utf8
      - name: Verify targeted Release debug configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/fff-diagnostics/CaptureFffExit.ps1
          $metadata = Get-Content build-gpu/fff-diagnostic-targets-Release.json -Raw | ConvertFrom-Json
          if (-not $metadata.msvc -or $metadata.compiler -ne 'MSVC' -or -not (Test-DiagnosticMsvcVersion $metadata.compiler_version) -or $metadata.configuration -ne 'Release') { throw 'Wrong actual diagnostic compiler/configuration' }
          $reply = 'build-gpu/.cmake/api/v1/reply'
          $index = @(Get-ChildItem $reply -Filter 'index-*.json')
          if ($index.Count -ne 1) { throw 'Expected one fresh CMake file-API index' }
          $model = Get-Content (Join-Path $reply (Get-Content $index[0].FullName -Raw | ConvertFrom-Json).reply.'codemodel-v2'.jsonFile) -Raw | ConvertFrom-Json
          $release = @($model.configurations | Where-Object name -EQ 'Release')
          if ($release.Count -ne 1) { throw 'Release target graph missing' }
          foreach ($name in @('libslic3r','support_material_on_wipe_tower_tests','periodic_modifier_tests')) {
            $entry = @($release[0].targets | Where-Object name -EQ $name)
            if ($entry.Count -ne 1) { throw "Actual debug target missing: $name" }
            $target = Get-Content (Join-Path $reply $entry[0].jsonFile) -Raw | ConvertFrom-Json
            $groups = @($target.compileGroups | Where-Object language -EQ 'CXX')
            if (-not $groups.Count) { throw "Actual CXX groups missing: $name" }
            foreach ($group in $groups) {
              $flags = @($group.compileCommandFragments | ForEach-Object fragment) -join ' '
              foreach ($required in @('/O2','/Zi','/FS')) { if (-not $flags.Contains($required)) { throw "Required actual compile option missing: $name $required" } }
              if ($flags -match '(^|\s)/Od(\s|$)') { throw "Release optimization changed: $name" }
            }
            if ($name -ne 'libslic3r') {
              $flags = @($target.link.commandFragments | ForEach-Object fragment) -join ' '
              foreach ($required in @('/DEBUG:FULL','/MAP:','/OPT:REF','/OPT:ICF','/PDBPAGESIZE:8192')) { if (-not $flags.Contains($required)) { throw "Required actual link option missing: $name $required" } }
            }
          }
          Copy-Item build-gpu/fff-diagnostic-targets-Release.json fff-diagnostic-configuration.json
      - name: Build full app selftest and runtime-copy target then install
        shell: pwsh
        run: |
          $log = Join-Path $pwd 'app-build.log'
          cmake --build build-gpu --target BambuStudio_app_gui BambuStudioDllsCopy slic3r-gpu-compute-selftest --config Release --parallel 2 -- /consoleloggerparameters:ErrorsOnly /filelogger "/fileloggerparameters:logfile=$log;verbosity=minimal"
          $result = $LASTEXITCODE
          if ($result) { exit $result }
          cmake --install build-gpu --config Release *> app-install.log
          $result = $LASTEXITCODE
          Get-Content app-install.log -Tail 60
          if ($result) { exit $result }
      - name: Package unverified app candidate before maintained test compilation
        id: candidate
        shell: pwsh
        run: |
          if (-not (Test-Path install-beta/cudart64_12.dll) -or -not (Test-Path install-beta/vulkan-1.dll)) { throw 'Portable runtime missing' }
          if (@(Get-ChildItem install-beta/resources/vulkan -Filter '*.spv').Count -ne 6) { throw 'Shader packaging incomplete' }
          New-Item -ItemType Directory install-beta/diagnostics,install-beta/licenses -Force | Out-Null
          if (@(git status --porcelain --untracked-files=no).Count) { throw 'Tracked source changed during the build' }
          Copy-Item LICENSE install-beta/LICENSE-AGPL-3.0.txt
          $notices = @(Get-ChildItem "$env:CUDA_PATH" -File | Where-Object Name -Match 'LICENSE|EULA')
          if (-not $notices.Count) { throw 'CUDA notices missing' }
          $notices | Copy-Item -Destination install-beta/licenses
          Copy-Item "$env:VULKAN_RUNTIME_DIR/VulkanRT-License.txt" install-beta/licenses
          $source = (git rev-parse HEAD).Trim()
          $source | Set-Content install-beta/SOURCE-COMMIT.txt -Encoding ascii
          "https://github.com/$env:GITHUB_REPOSITORY/tree/$source" | Set-Content install-beta/SOURCE-URL.txt -Encoding ascii
          Copy-Item dependency-source-used.txt install-beta/DEPENDENCIES-SOURCE.txt
          Copy-Item dependency-archive-sha256.txt install-beta/DEPENDENCIES-SHA256.txt
          'Experimental BambuStudio2.9.1 SMB/GPU beta. CPU is the default. Select SLIC3R_GPU_BACKEND=cuda|vulkan|auto before launching. CUDA12.9.1/sm61. CUDA/Vulkan cover validated rectilinear scanline arithmetic; Vulkan alone adds conservative tree broad phase. Hosted CI does not establish GPU hardware correctness or speedup. Local validation and complex wall/support matrix evidence are required before release.' | Set-Content install-beta/BETA-NOTES.txt
          foreach ($mode in @('cpu','cuda','vulkan','auto')) {
            $lines = @('@echo off', "set SLIC3R_GPU_BACKEND=$mode", 'if not exist "%~dp0beta-profile" mkdir "%~dp0beta-profile"', 'if errorlevel 1 exit /b 1', 'start "" "%~dp0bambu-studio.exe" --datadir "%~dp0beta-profile"')
            $lines | Set-Content "install-beta/Start-$mode.cmd" -Encoding ascii
          }
          'UNVERIFIED_COMPILED_CANDIDATE; maintained test targets have not yet compiled or run; hardware/output-equivalence/release validation pending.' | Set-Content install-beta/VALIDATION-STATUS.txt -Encoding ascii
          Compress-Archive install-beta UNVERIFIED-BambuStudio-2.9.1-SMB-GPU-v143-candidate.zip
          $hash = (Get-FileHash UNVERIFIED-BambuStudio-2.9.1-SMB-GPU-v143-candidate.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UNVERIFIED-BambuStudio-2.9.1-SMB-GPU-v143-candidate.zip" | Set-Content candidate-sha256.txt -Encoding ascii
      - name: Preserve unverified candidate before project tests
        uses: actions/upload-artifact@v6
        with:
          name: UNVERIFIED-BambuStudio-2.9.1-SMB-GPU-v143-candidate
          path: |
            UNVERIFIED-BambuStudio-2.9.1-SMB-GPU-v143-candidate.zip
            candidate-sha256.txt
          if-no-files-found: error
      - name: Compile all maintained default tests including GPU geometry contracts
        shell: pwsh
        run: |
          $log = Join-Path $pwd 'maintained-build.log'
          cmake --build build-gpu --target ALL_BUILD --config Release --parallel 2 -- /consoleloggerparameters:ErrorsOnly /filelogger "/fileloggerparameters:logfile=$log;verbosity=minimal"
          $result = $LASTEXITCODE
          if ($result) { exit $result }
          $test = @(Get-ChildItem build-gpu -Recurse -Filter gpu_geometry_tests.exe)
          if ($test.Count -ne 1) { throw 'Expected one full geometry test executable' }
          Copy-Item $test[0].FullName install-beta/diagnostics
      - name: Package complete compiled pretest candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($required in @('bambu-studio.exe','BambuStudio.dll','slic3r-gpu-compute-selftest.exe','diagnostics/gpu_geometry_tests.exe','cudart64_12.dll','vulkan-1.dll','SOURCE-COMMIT.txt','SOURCE-URL.txt','LICENSE-AGPL-3.0.txt')) {
            if (-not (Test-Path -LiteralPath "install-beta/$required" -PathType Leaf)) { throw "Compiled pretest candidate missing: $required" }
          }
          if ((Get-Content install-beta/SOURCE-COMMIT.txt -Raw).Trim() -ne (git rev-parse HEAD).Trim()) { throw 'Compiled pretest source identity differs' }
          if (@(git status --porcelain --untracked-files=no).Count) { throw 'Tracked source changed before compiled pretest package' }
          if (@(Get-ChildItem install-beta/resources/vulkan -File -Filter '*.spv').Count -ne 6) { throw 'Compiled pretest shaders incomplete' }
          if (-not @(Get-ChildItem install-beta/licenses -File).Count) { throw 'Compiled pretest notices missing' }
          'UNQUALIFIED_COMPLETE_PRETEST_CANDIDATE; app and maintained test executables compiled; test/hardware/model/GUI/performance validation pending; not a qualified release.' | Set-Content install-beta/VALIDATION-STATUS.txt -Encoding ascii
          Compress-Archive install-beta UNQUALIFIED-BambuStudio-2.9.1-SMB-GPU-v143-complete-pretest.zip
          $hash = (Get-FileHash UNQUALIFIED-BambuStudio-2.9.1-SMB-GPU-v143-complete-pretest.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UNQUALIFIED-BambuStudio-2.9.1-SMB-GPU-v143-complete-pretest.zip" | Set-Content complete-pretest-sha256.txt -Encoding ascii
      - name: Preserve complete compiled pretest candidate
        uses: actions/upload-artifact@v6
        with:
          name: UNQUALIFIED-BambuStudio-2.9.1-SMB-GPU-v143-complete-pretest
          path: |
            UNQUALIFIED-BambuStudio-2.9.1-SMB-GPU-v143-complete-pretest.zip
            complete-pretest-sha256.txt
          if-no-files-found: error
      - name: Retain actual FFF binaries and symbols before any native test
        shell: pwsh
        run: ./.github/fff-diagnostics/RetainFffDiagnostics.ps1
      - name: Preserve unqualified FFF diagnostic archive before CTest
        uses: actions/upload-artifact@v6
        with:
          name: UNQUALIFIED-Bambu-FFF-diagnostic-symbols
          path: |
            UNQUALIFIED-Bambu-FFF-diagnostic-symbols.zip
            fff-diagnostic-sha256.txt
            fff-diagnostic-identity.json
          if-no-files-found: error
      - name: Run focused exact preflight and Fill contracts in CPU mode
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install-beta;$env:PATH"
          $env:SLIC3R_GPU_TEST_RESOURCES = "$pwd/install-beta/resources"
          & install-beta/diagnostics/gpu_geometry_tests.exe '[Gpu],[GpuBatchPreflight]' -r junit -o "$pwd/focused-gpu-tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [xml]$report = Get-Content focused-gpu-tests.xml -Raw
          if (@($report.SelectNodes('//testcase')).Count -lt 20) { throw 'Focused geometry/preflight cases did not execute' }
      - name: Run focused native filament capacity context cases
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install-beta;$env:PATH"
          $env:SLIC3R_GPU_TEST_RESOURCES = "$pwd/install-beta/resources"
          $test = @(Get-ChildItem build-gpu -Recurse -File -Filter filament_group_tests.exe)
          if ($test.Count -ne 1) { throw 'Expected one actual maintained focused test executable' }
          & $test[0].FullName '[capacity_fallback]' -r xml -o "$pwd/focused-filament-context.xml" *> focused-filament-context.log
          $result = $LASTEXITCODE
          Get-Content focused-filament-context.log -Tail 60
          if ($result) { exit $result }
          python .github/gpu-validation/check_focused_catch.py --xml focused-filament-context.xml --repo . --kind context > focused-filament-context-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run focused native enum and capacity fallback cases
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install-beta;$env:PATH"
          $env:SLIC3R_GPU_TEST_RESOURCES = "$pwd/install-beta/resources"
          $test = @(Get-ChildItem build-gpu -Recurse -File -Filter filament_group_tests.exe)
          if ($test.Count -ne 1) { throw 'Expected one actual maintained focused test executable' }
          & $test[0].FullName '[enum_capacity_fallback],[capacity_fallback]' -r xml -o "$pwd/focused-filament-enum-capacity.xml" *> focused-filament-enum-capacity.log
          $result = $LASTEXITCODE
          Get-Content focused-filament-enum-capacity.log -Tail 60
          if ($result) { exit $result }
          python .github/gpu-validation/check_focused_catch.py --xml focused-filament-enum-capacity.xml --repo . --kind capacity > focused-filament-enum-capacity-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run focused actual enum-vector configuration regression
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install-beta;$env:PATH"
          $env:SLIC3R_GPU_TEST_RESOURCES = "$pwd/install-beta/resources"
          $test = @(Get-ChildItem build-gpu -Recurse -File -Filter bambu_enum_map_tests.exe)
          if ($test.Count -ne 1) { throw 'Expected one actual maintained focused test executable' }
          & $test[0].FullName '[EnumMaps]' -r xml -o "$pwd/focused-config-enum-map.xml" *> focused-config-enum-map.log
          $result = $LASTEXITCODE
          Get-Content focused-config-enum-map.log -Tail 60
          if ($result) { exit $result }
          python .github/gpu-validation/check_focused_catch.py --xml focused-config-enum-map.xml --repo . --kind enum-map > focused-config-enum-map-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run focused preset include-diff cache regression
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install-beta;$env:PATH"
          $env:SLIC3R_GPU_TEST_RESOURCES = "$pwd/install-beta/resources"
          $test = @(Get-ChildItem build-gpu -Recurse -File -Filter bambu_enum_map_tests.exe)
          if ($test.Count -ne 1) { throw 'Expected one actual maintained focused test executable' }
          & $test[0].FullName '[PresetIncludeDiffCache]' -r xml -o "$pwd/focused-preset-include-diff.xml" *> focused-preset-include-diff.log
          $result = $LASTEXITCODE
          Get-Content focused-preset-include-diff.log -Tail 60
          if ($result) { exit $result }
          python .github/gpu-validation/check_focused_catch.py --xml focused-preset-include-diff.xml --repo . --kind preset-include-diff > focused-preset-include-diff-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run focused CUDA dispatch buffer ownership regression
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install-beta;$env:PATH"
          $env:SLIC3R_GPU_TEST_RESOURCES = "$pwd/install-beta/resources"
          $test = @(Get-ChildItem build-gpu -Recurse -File -Filter gpu_geometry_tests.exe)
          if ($test.Count -ne 1) { throw 'Expected one actual maintained focused test executable' }
          & $test[0].FullName '[CudaDispatchBuffers]' -r xml -o "$pwd/focused-cuda-buffer.xml" *> focused-cuda-buffer.log
          $result = $LASTEXITCODE
          Get-Content focused-cuda-buffer.log -Tail 60
          if ($result) { exit $result }
          python .github/gpu-validation/check_focused_catch.py --xml focused-cuda-buffer.xml --repo . --kind cuda-buffer > focused-cuda-buffer-summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Collect CPU-only FFF phase output and exact native exit codes
        shell: pwsh
        run: ./.github/fff-diagnostics/CaptureFffExit.ps1
      - name: Run project tests in CPU mode
        shell: pwsh
        run: |
          $env:PATH = "$pwd/install-beta;$env:PATH"
          $env:SLIC3R_GPU_TEST_RESOURCES = "$pwd/install-beta/resources"
          # Upstream deliberately excludes these obsolete suites from ALL.
          # Run maintained defaults plus the explicitly built GPU geometry suite.
          ctest --test-dir build-gpu -C Release --output-on-failure --parallel 2 --exclude-regex '^(libnest2d_tests|libslic3r_tests|fff_print_tests|sla_print_tests|cpp17_tests)$' --output-junit "$pwd/tests.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & install-beta/slic3r-gpu-compute-selftest.exe "$pwd/install-beta/resources/vulkan" cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package only after all maintained native gates pass
        shell: pwsh
        run: |
          'CI_STANDALONE_AND_ALL_TEN_MAINTAINED_NATIVE_TESTS_PASSED; legacy suites remain excluded; physical GPU, full-app output equivalence and release validation pending.' | Set-Content install-beta/VALIDATION-STATUS.txt -Encoding ascii
          Compress-Archive install-beta BambuStudio-2.9.1-SMB-GPU-beta-Windows-sm61.zip
          $hash = (Get-FileHash BambuStudio-2.9.1-SMB-GPU-beta-Windows-sm61.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BambuStudio-2.9.1-SMB-GPU-beta-Windows-sm61.zip" | Set-Content package-sha256.txt -Encoding ascii
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bambu-gpu-beta-evidence
          path: |
            tests.xml
            focused-gpu-tests.xml
            focused-filament-context.xml
            focused-filament-context.log
            focused-filament-enum-capacity.xml
            focused-filament-enum-capacity.log
            focused-filament-context-summary.json
            focused-filament-enum-capacity-summary.json
            focused-config-enum-map.xml
            focused-config-enum-map.log
            focused-config-enum-map-summary.json
            focused-preset-include-diff.xml
            focused-preset-include-diff.log
            focused-preset-include-diff-summary.json
            complete-pretest-sha256.txt
            focused-cuda-buffer.xml
            focused-cuda-buffer.log
            focused-cuda-buffer-summary.json
            maintained-test-manifest.json
            fff-diagnostic-configuration.json
            fff-diagnostic-identity.json
            fff-diagnostic-sha256.txt
            fff-native-phase-evidence
            app-build.log
            app-install.log
            maintained-build.log
            candidate-sha256.txt
            dependency-archive-sha256.txt
            dependency-source-used.txt
            dependency-compiler-used.cmake
            build-gpu/CMakeCache.txt
            package-sha256.txt
            build-gpu/Testing/Temporary/LastTest.log
      - uses: actions/upload-artifact@v6
        with:
          name: BambuStudio-2.9.1-SMB-GPU-beta-Windows-sm61
          path: BambuStudio-2.9.1-SMB-GPU-beta-Windows-sm61.zip
          if-no-files-found: error
